[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resfit"
version = "0.1.0"
description = "Residual off-policy RL fine-tuning (ResFiT) with stage-aware reward models."
requires-python = "==3.10.*"

dependencies = [
    # ── The torch stack. Pinned as one matched CUDA build: torch 2.11.0+cu128 <->
    #    torchvision 0.26.0 <-> the source-built torchrl 0.9.2. Mixing them gives
    #    "operator torchvision::nms does not exist" or a torchrl undefined symbol.
    #    [tool.uv.sources] below sends these to the pytorch cu128 index.
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "torchcodec==0.11.0",
    "tensordict==0.9.1",
    "torchrl",                       # compiled from git - see [tool.uv.sources]

    # ── Vendored simulators / policy libs, editable from deps/
    "robosuite",
    "mimicgen",
    "dexmimicgen",
    "lerobot",

    # ── resfit's own direct requirements
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "wandb==0.24.2",
    "flask==3.1.3",
    "flask-cors==6.0.0",
    "imageio==2.36.1",
    "imageio-ffmpeg==0.6.0",
    "matplotlib>=3.7",
    "pyarrow>=17",
    "requests>=2.31",
    "tqdm>=4.66",
    "numpy==2.2.6",
    "h5py>=3.10",
    "tabulate>=0.9",
    # lerobot needs these for ACT policy loading but only lists them as optional
    # extras, so declare them here to guarantee they land in the env.
    "transformers==4.48.0",
    "accelerate>=1.0",
    # lerobot uses the datasets 3.x API; 5.x breaks LeRobotDataset loading.
    "datasets==3.6.0",
    # resfit's vectorized env needs gymnasium 1.x (AutoresetMode); lerobot pins
    # 0.29.1, which is overridden below.
    "gymnasium==1.1.1",
    # robosuite 1.5.1 breaks on mujoco 3.10's mj_fullM signature.
    "mujoco==3.3.2",
]

[project.optional-dependencies]
# Hardware SDKs for the real Trossen station. Kept OUT of the default install
# because a training server has no camera and no arm, and these wheels are
# platform-specific. Without them trossen_real still IMPORTS and its tests still
# pass - camera_manager.py and arm_driver.py guard the import and fall back to
# HAS_REALSENSE / HAS_TROSSEN_SDK = False - so the absence only shows up when
# you try to talk to hardware. Install on station machines with:
#     uv sync --extra real
real = [
    "pyrealsense2==2.56.5.9235",
    "trossen-arm==1.10.0",
]

[tool.setuptools.packages.find]
include = ["resfit*"]

# ══════════════════════════════════════════════════════════════════════════════
# uv configuration - this replaces scripts/setup_uv_env.sh entirely.
# ══════════════════════════════════════════════════════════════════════════════

# The CUDA wheels do not exist on PyPI. `explicit = true` means ONLY packages
# that name this index below are fetched from it, so everything else still
# resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

# torchrl is BUILT FROM SOURCE, not installed from a wheel. The published
# torchrl 0.9.2 wheel is ABI-built against an older torch and crashes on torch
# 2.11 with `undefined symbol: ... _wrap_outputs`. The pytorch cu128 index only
# carries torchrl 0.13.x, which needs tensordict 0.13 and has API changes this
# code does not target.
torchrl = { git = "https://github.com/pytorch/rl.git", rev = "v0.9.2" }

robosuite = { path = "deps/robosuite", editable = true }
mimicgen = { path = "deps/mimicgen", editable = true }
dexmimicgen = { path = "deps/dexmimicgen", editable = true }
lerobot = { path = "deps/lerobot", editable = true }

[tool.uv]
# torchrl must compile against the torch ALREADY in the environment, not against
# a fresh copy pulled into an isolated build env (which would be the CPU wheel
# from PyPI and produce a binary-incompatible extension).
no-build-isolation-package = ["torchrl"]

# --overrides, not --constraints. A constraint must satisfy EVERY requirer and so
# is "unsatisfiable" against a hard `==` pin; an override REPLACES it.
#   * lerobot pins gymnasium==0.29.1, but resfit uses the 1.x autoreset API.
#   * lerobot is written against the datasets 3.x API; 5.x returns a lazy Column.
#   * robosuite 1.5.1 calls mujoco 3.3's mj_fullM(m, dst, M).
#   * dexmimicgen hard-pins numpy==1.23.3, a stale 2023 pin. The original
#     installer worked around this with `--no-deps`, which threw away ALL of its
#     dependencies; overriding just numpy is the narrower fix.
override-dependencies = [
    "gymnasium==1.1.1",
    "datasets==3.6.0",
    "mujoco==3.3.2",
    "numpy==2.2.6",
]
