# =============================================================================
# station3.yaml - every configurable parameter for Station-3 residual RL.
#
# WHERE THESE VALUES CAME FROM
# ----------------------------
# The file was generated from the real dataclass schema
# (resfit/rl_finetuning/config/), so all 177 parameters are present and you can
# see the whole surface in one place. Then Station-1's .sh values were applied
# on top:
#
#   177  parameters in the schema
#    74  were set explicitly by scripts/TrossenStation1Real/*.sh
#         - of those, 37 DIFFER from the code default: real choices, marked
#           `<- not a code default`
#         - the other 37 happen to equal the code default anyway
#   104  were never mentioned in any .sh and are left at the code default -
#        inherited, not chosen. Treat them as "nobody has tuned this yet".
#
# Station-3-specific values (dataset, station name, W&B project) replace
# Station-1's, and base ACT 50k / learning_starts 15000 / real_max_steps 350 are
# this station's own decisions.
#
# Comments are condensed from the Station-1 scripts - the originals in
# scripts/TrossenStation1Real/train_residual_rl_real.sh have the long form.
#
# THIS FILE HOLDS VALUES ONLY - no `defaults:` - so both the plain and the
# distributed mode files can pull it in. They register different structured
# configs (residual_td3_trossen_real_config vs ..._dist_config).
#
# ### HASHED ###
# Lines marked `# HASHED (...)` feed a replay-buffer cache key. CHANGE ONE AND
# EVERY SCRIPT GETS A DIFFERENT, EMPTY BUFFER - you re-collect at the robot and
# rebuild the offline buffer. Keeping them stable is YOUR responsibility.
# `./check_configs.sh` will tell you if the modes have drifted apart.
# See docs/real/BUFFER_CACHES.md for which value lands in which hash.
# =============================================================================
seed: 42    # <- not a code default
torch_deterministic: false
debug: false
# selects the env family. Part of BOTH cache hashes.
task: trossen_real    # HASHED (both)
num_envs: 1
eval_num_envs: 1
# 0 = no automated eval on real hardware (an eval would need
# the robot to run unattended episodes).
eval_num_episodes: 0    # <- not a code default
eval_horizon: null
headless: true
# false = reward is float(next.done), i.e. the sparse pedal signal.
# true would use the dataset's dense next.reward column instead.
reward_shaping: false    # HASHED (offline)
video_key: observation.images.agentview
# the two wrist cameras the policy actually consumes. Must match what
# policy_server.py reports, and it is hashed as 'image_keys'.
rl_camera:    # HASHED (both, as 'image_keys')  <- not a code default
- observation.images.cam_left_wrist
- observation.images.cam_right_wrist
algo:
  # online env steps. At 20Hz, 75000 ~ 62 min of pure motion,
  # more in practice with resets and interventions.
  total_timesteps: 75000    # <- not a code default
  batch_size: 256    # HASHED (both (via offline/online batch size))
  # circular. Past this, the OLDEST transitions are evicted - which
  # are your warm-up data. See docs/real/BUFFER_CACHES.md.
  buffer_size: 70000    # HASHED (online)  <- not a code default
  # random/base-policy warm-up filling the ONLINE buffer via live
  # env.step() BEFORE any gradient update. At 20Hz, 15000 ~ 12 min
  # (~30 episodes of 350 steps).
  learning_starts: 15000    # HASHED (online (as 'size'))  <- not a code default
  # 0.9975 over a 350-step horizon; a 0.99 discount would make the
  # end of an episode nearly invisible to the critic.
  gamma: 0.9975    # HASHED (both)  <- not a code default
  # UTD - gradient updates per env step. 4 is what the sim runs used.
  num_updates_per_iteration: 4
  actor_updates_per_iteration: 1
  update_every_n_steps: 1
  # half of every batch comes from the offline buffer, half from the
  # online one. With batch_size it decides BOTH batch sizes, so it
  # lands in both hashes.
  offline_fraction: 0.5    # HASHED (both (via offline/online batch size))
  # n-step returns, applied as a WRITE-TIME (inverse) transform, so
  # the stored rows are already collapsed. Do not re-add dumped rows.
  n_step: 3    # HASHED (both)
  terminated_only_bootstrap: false
  # critic-only updates before the actor is touched. Overridden per
  # mode - see conf/modes/.
  critic_warmup_steps: 0    # <- not a code default
  actor_lr_warmup_steps: 0
  # exploration noise during warm-up, per joint. Mirrors action_scale
  # so warm-up stays inside the residual range the actor can produce.
  random_action_noise_scale: [0.15, 0.15, 0.15, 0.05, 0.05, 0.05, 0.1]    # HASHED (online)  <- not a code default
  sampling_strategy: uniform    # HASHED (both)
  prefetch_batches: 3    # <- not a code default
  priority_alpha: 0.6
  priority_beta: 0.4
  stddev_max: 0.3    # <- not a code default
  stddev_min: 0.1    # <- not a code default
  stddev_step: 100000    # <- not a code default
  stddev_schedule: linear(0.05,0.05,300000)
  critic_warmup_save_freq: 5000
  # checkpoint the online buffer every N transitions during warm-up.
  # This is what makes a dropped robot connection resumable - without
  # it the buffer is only written once, at the very end.
  online_warmup_save_freq: 1000    # <- not a code default
  # MUST stay true on real hardware; the trainer asserts it. The
  # 'pure random minus base' warm-up can imply arbitrarily large
  # corrections, which is unsafe on a real arm.
  use_base_policy_for_warmup: true
  progressive_clipping_steps: 0
  train_offline_rl: false
  offline_rl_steps: 0    # <- not a code default
  offline_rl_bc_alpha: 0.2
  offline_eval_interval_every_steps: 5000
  offline_save_freq: 5000
  offline_rl_load_ckpt: latest
  offline_rl_sampling_method: fixed_ratio
  offline_rl_offline_ratio: 0.5
  offline_pretrain_only: false
agent:
  device: cuda
  # 1e-6 for both actor and critic - deliberately small. The residual
  # rides on a frozen BC policy; large steps destabilise it.
  actor_lr: 1e-06    # <- not a code default
  critic_lr: 1e-06    # <- not a code default
  critic_target_tau: 0.005
  stddev_clip: 0.3
  lr_warmup_steps: 0
  lr_warmup_start: 1.0e-08
  use_prop: 1
  enc_type: vit
  vit:
    depth: 1
    embed_dim: 128
    embed_norm: 0
    embed_style: embed2
    num_heads: 4
    patch_size: 8
    stride: -1
  critic:
    drop: 0.0
    feature_dim: 128
    fuse_patch: 1
    hidden_dim: 1024
    norm_weight: 0
    orth: 1
    spatial_emb: 1024
    # 2 Q heads with min over both (policy_gradient_type: min) - plain
    # TD3 twin critics, not the 10-head ensemble the default assumes.
    num_q: 2    # <- not a code default
    loss:
      type: mse
      n_bins: 51
      v_min: 0.0
      v_max: 1.0
      sigma: -1.0
    policy_gradient_type: min    # <- not a code default
    num_layers: 2
    use_layer_norm: true
    min_q_heads: 2
  actor:
    feature_dim: 128
    hidden_dim: 1024
    dropout: 0.0
    orth: 1
    max_action_norm: -1.0
    spatial_emb: 0
    # small init so the residual starts near zero, i.e. the base policy
    # is left alone until the critic has something to say.
    actor_last_layer_init_scale: 0.01    # <- not a code default
    actor_last_layer_init_distribution: normal
    actor_intermediate_layer_init_distribution: default
    action_l2_reg_weight: 0.0
    # per-joint residual limit (6 joint deltas + gripper). START SMALL on
    # real hardware and raise only after watching it move.
    action_scale: [0.15, 0.15, 0.15, 0.05, 0.05, 0.05, 0.1]    # <- not a code default
    num_layers: 2
    use_layer_norm: true
  critic_grad_clip_norm: 10.0    # <- not a code default
  actor_grad_clip_norm: 10.0    # <- not a code default
  # 0 = no BC regularisation on the residual actor.
  bc_loss_coef: 0.0
  bc_loss_dynamic: 0
  bc_backprop_encoder: false
  # false = the vision encoder is trained too.
  freeze_encoder: false
  clip_q_target_to_reward_range: false
  target_action_noise: true
offline_data:
  # MUST be the '_old' v2.1 copy: the vendored lerobot is
  # CODEBASE_VERSION 'v2.1' and cannot read the v3.0 sibling.
  name: PickCubeAndInsert_Station3_Trial1_deltajoint_old    # HASHED (offline)  <- not a code default
  num_episodes: 178    # HASHED (offline)  <- not a code default
  # true = each offline transition's base action is fetched from
  # policy_server.py. This is why building the offline buffer needs
  # the policy server (and, incidentally, the robot).
  use_base_policy_for_base_actions: true    # HASHED (offline)
  min_action_range: 0.1    # HASHED (both)
  min_state_std: 0.1    # HASHED (both)
  # frames are resized to 84x84 AFTER the policy query, before storing.
  image_size: 84    # <- not a code default
  reward_parquet: null
  reward_column: reward_pbrs
  # HASHED, and deliberately NOT ${hydra:runtime.cwd}/... - that resolves to the
  # LAUNCH directory, so running from anywhere but the repo root would silently
  # change the offline cache hash and rebuild the buffer (verified: launching from
  # /tmp gave root: /tmp/trossen_real/...). RESFIT_ROOT lets another machine point
  # elsewhere without editing this file.
  root: "${oc.env:RESFIT_ROOT,/home/qte9489/personal_abhi/temp/residual-offpolicy-rl}/trossen_real/datasets/PickCubeAndInsert_Station3_Trial1_deltajoint_old"    # HASHED (offline)  <- not a code default
  remap_preset: null
wandb:
  project: trossen-station3-pick-and-insert-residual-td3    # <- not a code default
  mode: online
  entity: null
  notes: null
  continue_run_id: null
  name: null    # HASHED (both)
  group: null
log_freq: 100
eval_interval_every_steps: 1000000    # <- not a code default
checkpoint_interval: -1
save_video: false    # <- not a code default
eval_first: false    # <- not a code default
actor_name: null
real_hardware: true
station_config_name: trossen_station3_single    # <- not a code default
policy_server_url: "http://127.0.0.1:5070"
real_action_space: delta_joint
# episode horizon. Also the training env's max_steps, and hashed as
# 'horizon'.
real_max_steps: 350    # HASHED (online (as 'horizon'))  <- not a code default
# pause after a reset before the next episode starts.
real_settle_time_s: 0.5    # <- not a code default
# true = leader arm + foot pedal can take over mid-episode; those
# transitions are stored with intervened=True.
enable_intervention: true    # <- not a code default
real_log_file: null
use_reward_manipulation_wrapper: false
terminate_on_success: false
dense_success_bonus_scale: null
base_policy:
  wandb_id: ''
  wt_type: best
  wt_version: latest
  local_path: null
reward_model:
  enabled: false
  backend: sarm
  server_url: http://127.0.0.1:8001
  request_timeout_s: 20.0
  require_server: true
  task_prompt: pick up the can and place it in the bin
  query_every_k: 5
  client_history_len: 40
  image_key: observation.images.agentview
  image_vflip: false
  num_stages: 4
  potentials:
  - 0.0
  - 0.05
  - 0.1
  - 0.15
  pbrs_gamma: null
  keep_sparse_term: true
  reward_mode: pbrs
  milestone_payouts:
  - 0.0
  - 0.1
  - 0.1
  - 0.1
  milestone_success_bonus: 0.7
  hysteresis_k: 5
  conf_threshold: 0.8
  monotonic: true
  offline_key: null
# checkpoint every N steps.
save_freq: 5000    # <- not a code default
# MUST stay true. With false the trainer rmtree's the run directory
# on success - deleting the checkpoints AND online_buffer_final.
no_cleanup: true    # <- not a code default
save_training_rollouts: false
training_rollout_prob: 0.2
resume_ckpt: null
# NOTE: `role` and `dist.*` are deliberately NOT here. They exist only in the
# distributed schema (ResidualTD3TrossenRealDistConfig), and the plain schema
# would reject them. They live in conf/execution/*.yaml instead.
