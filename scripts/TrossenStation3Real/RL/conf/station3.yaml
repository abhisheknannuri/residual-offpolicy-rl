# =============================================================================
# station3.yaml - shared configuration for Station-3 residual RL.
#
# Holds values only (no `defaults:`), so both the plain and the distributed mode
# files can include it. Organised like the dataclasses in
# resfit/rl_finetuning/config/, and lists every parameter the schema defines so
# the whole surface is visible in one place.
#
# Parameters marked `# HASHED` feed a replay-buffer cache key. Changing one
# gives every script a different, empty buffer: the offline buffer is rebuilt
# and the online warm-up must be re-collected at the robot. Keeping them stable
# is a matter of discipline, not enforcement - `./check_configs.sh` reports
# whether the modes still agree. docs/real/BUFFER_CACHES.md says which value
# lands in which hash.
# =============================================================================
seed: 42
torch_deterministic: false
debug: false
# selects the env family. Part of BOTH cache hashes.
task: trossen_real    # HASHED (both)
num_envs: 1
eval_num_envs: 1
# 0 = no automated eval on real hardware (an eval would need
# the robot to run unattended episodes).
eval_num_episodes: 1
eval_horizon: null
headless: true
# false = reward is float(next.done), i.e. the sparse pedal signal.
# true would use the dataset's dense next.reward column instead.
reward_shaping: false    # HASHED (offline)
video_key: observation.images.agentview
# the two wrist cameras the policy actually consumes. Must match what
# policy_server.py reports, and it is hashed as 'image_keys'.
rl_camera:    # HASHED (both, as 'image_keys')
- observation.images.cam_left_wrist
- observation.images.cam_right_wrist
algo:
  # online env steps. At 20Hz, 75000 ~ 62 min of pure motion,
  # more in practice with resets and interventions.
  total_timesteps: 75000
  batch_size: 256    # HASHED (both, via the offline/online batch split)
  # circular. Past this, the OLDEST transitions are evicted - which
  # are your warm-up data. See docs/real/BUFFER_CACHES.md.
  buffer_size: 70000    # HASHED (online)
  # random/base-policy warm-up filling the ONLINE buffer via live
  # env.step() BEFORE any gradient update. At 20Hz, 15000 ~ 12 min
  # (~30 episodes of 350 steps).
  learning_starts: 15000    # HASHED (online, as 'size')
  # 0.9975 over a 350-step horizon; a 0.99 discount would make the
  # end of an episode nearly invisible to the critic.
  gamma: 0.9975    # HASHED (both)
  # UTD - gradient updates per env step. 4 is what the sim runs used.
  num_updates_per_iteration: 4
  actor_updates_per_iteration: 1
  update_every_n_steps: 1
  # half of every batch comes from the offline buffer, half from the
  # online one. With batch_size it decides BOTH batch sizes, so it
  # lands in both hashes.
  offline_fraction: 0.5    # HASHED (both, via the offline/online batch split)
  # n-step returns, applied as a WRITE-TIME (inverse) transform, so
  # the stored rows are already collapsed. Do not re-add dumped rows.
  n_step: 3    # HASHED (both)
  terminated_only_bootstrap: false
  # critic-only updates before the actor is touched. Overridden per
  # mode - see conf/modes/.
  critic_warmup_steps: 15000
  actor_lr_warmup_steps: 0
  # exploration noise during warm-up, per joint. Mirrors action_scale
  # so warm-up stays inside the residual range the actor can produce.
  random_action_noise_scale: [0.15, 0.15, 0.15, 0.05, 0.05, 0.05, 0.1]    # HASHED (online)
  sampling_strategy: uniform    # HASHED (both)
  prefetch_batches: 4
  priority_alpha: 0.6
  priority_beta: 0.4
  stddev_max: [0.015, 0.015, 0.015, 0.03, 0.03, 0.03, 0.0125]
  stddev_min: [0.015, 0.015, 0.015, 0.03, 0.03, 0.03, 0.0125]
  stddev_step: 15000
  stddev_schedule: linear(0.05,0.05,300000)
  critic_warmup_save_freq: 5000
  # checkpoint the online buffer every N transitions during warm-up.
  # This is what makes a dropped robot connection resumable - without
  # it the buffer is only written once, at the very end.
  online_warmup_save_freq: 2000
  # MUST stay true on real hardware; the trainer asserts it. The
  # 'pure random minus base' warm-up can imply arbitrarily large
  # corrections, which is unsafe on a real arm.
  use_base_policy_for_warmup: true
  progressive_clipping_steps: 0
  train_offline_rl: false
  offline_rl_steps: 0
  offline_rl_bc_alpha: 0.2
  offline_eval_interval_every_steps: 5000
  offline_save_freq: 5000
  offline_rl_load_ckpt: latest
  offline_rl_sampling_method: fixed_ratio
  offline_rl_offline_ratio: 0.5
  offline_pretrain_only: false
agent:
  device: cuda
  # 1e-6 for both actor and critic - deliberately small. The residual
  # rides on a frozen BC policy; large steps destabilise it.
  actor_lr: 1e-06
  critic_lr: 1e-4
  critic_target_tau: 0.005
  stddev_clip: 0.3
  lr_warmup_steps: 0
  lr_warmup_start: 1.0e-08
  use_prop: 1
  enc_type: vit
  vit:
    depth: 1
    embed_dim: 128
    embed_norm: 0
    embed_style: embed2
    num_heads: 4
    # UNUSED. Declared in VitEncoderConfig but read nowhere; MinVit does not
    # accept them and PatchEmbed2 hardcodes its conv stack:
    #   conv1 3->embed_dim kernel 8 stride 4,  conv2 kernel 3 stride 2.
    # Setting them to any value builds an identical network. The patch count
    # follows image_size through those hardcoded kernels, not through these.
    patch_size: 8
    stride: -1
  critic:
    drop: 0.0
    feature_dim: 128
    fuse_patch: 1
    hidden_dim: 1024
    norm_weight: 0
    orth: 1
    spatial_emb: 1024
    # 2 Q heads with min over both (policy_gradient_type: min) - plain
    # TD3 twin critics, not the 10-head ensemble the default assumes.
    num_q: 10
    loss:
      type: mse
      n_bins: 51
      v_min: 0.0
      v_max: 1.0
      sigma: -1.0
    policy_gradient_type: ensemble_mean
    num_layers: 2
    use_layer_norm: true
    min_q_heads: 2
  actor:
    feature_dim: 128
    hidden_dim: 1024
    dropout: 0.0
    orth: 1
    max_action_norm: -1.0
    spatial_emb: 0
    # small init so the residual starts near zero, i.e. the base policy
    # is left alone until the critic has something to say.
    actor_last_layer_init_scale: 0.0
    actor_last_layer_init_distribution: normal
    actor_intermediate_layer_init_distribution: default
    action_l2_reg_weight: 0.0
    # per-joint residual limit (6 joint deltas + gripper). START SMALL on
    # real hardware and raise only after watching it move.
    action_scale: [0.15, 0.15, 0.15, 0.05, 0.05, 0.05, 0.1]
    num_layers: 2
    use_layer_norm: true
  critic_grad_clip_norm: 1.0
  actor_grad_clip_norm: 1.0
  # 0 = no BC regularisation on the residual actor.
  bc_loss_coef: 0.0
  bc_loss_dynamic: 0
  bc_backprop_encoder: false
  # false = the vision encoder is trained too.
  freeze_encoder: false
  clip_q_target_to_reward_range: false
  target_action_noise: true
offline_data:
  # MUST be the '_old' v2.1 copy: the vendored lerobot is
  # CODEBASE_VERSION 'v2.1' and cannot read the v3.0 sibling.
  name: PickCubeAndInsert_Station3_Trial1_deltajoint_old    # HASHED (offline)
  num_episodes: 50    # HASHED (offline)
  # true = each offline transition's base action is fetched from
  # policy_server.py. This is why building the offline buffer needs
  # the policy server (and, incidentally, the robot).
  use_base_policy_for_base_actions: true    # HASHED (offline)
  min_action_range: 0.1    # HASHED (both)
  min_state_std: 0.1    # HASHED (both)
  # frames are resized to this AFTER the policy query, before storing. Only the
  # RL encoder/critic/actor see the resized frames; the base policy always gets
  # full-resolution ones. The ViT patch count is DERIVED from this through
  # PatchEmbed2's conv stack (conv1 k8 s4, conv2 k3 s2):
  #   c1 = floor((S - 8) / 4) + 1
  #   c2 = floor((c1 - 3) / 2) + 1
  #   num_patch = c2 * c2
  #   84 -> 81   96 -> 121   112 -> 169   128 -> 225   160 -> 361
  # repr_dim = num_patch * agent.vit.embed_dim * len(rl_camera), so 84 gives
  # 20736. Nothing else needs changing to move this; a buffer built at one size
  # cannot be reused at another, so point at a fresh one.
  image_size: 84
  reward_parquet: null
  reward_column: reward_pbrs
  # Absolute path to the dataset directory. Edit it when the repo or the
  # dataset lives somewhere else (e.g. on the server), or override per run:
  #     ./01_populate_buffers.sh offline_data.root=/abs/path/to/dataset
  root: /home/qte9489/personal_abhi/temp/residual-offpolicy-rl/trossen_real/datasets/PickCubeAndInsert_Station3_Trial1_deltajoint_old    # HASHED (offline)
  remap_preset: null
wandb:
  project: trossen-station3-pick-and-insert-residual-td3
  mode: online
  entity: null
  notes: null
  continue_run_id: null
  name: null    # HASHED (both)
  group: null
log_freq: 100
eval_interval_every_steps: 999999999
checkpoint_interval: -1
save_video: false
eval_first: false
actor_name: null
real_hardware: true
station_config_name: trossen_station3_single
policy_server_url: "http://127.0.0.1:5070"
real_action_space: delta_joint
# episode horizon. Also the training env's max_steps, and hashed as
# 'horizon'.
real_max_steps: 350    # HASHED (online, as 'horizon')
# pause after a reset before the next episode starts.
real_settle_time_s: 2.0
# true = leader arm + foot pedal can take over mid-episode; those
# transitions are stored with intervened=True.
enable_intervention: false
real_log_file: null

# --- how we talk to policy_server.py -----------------------------------------
# These apply EVERYWHERE the base policy is queried - the offline buffer build,
# the online warm-up and online RL - because they describe the wire format, not
# a training choice.

# How frames are packed into the request body.
#   raw   uncompressed bytes + base64. ~512 KB per query for two 256x256 frames.
#   zlib  the same bytes deflated. Lossless, ~3.3x smaller.
#   jpeg  ~15x smaller at quality 95, and lossy - but measured on real wrist-cam
#         frames it distorts LESS than the AV1 the LeRobot dataset is itself
#         stored in (mean abs err 0.79 vs 1.39 on 0-255).
# The offline build is 55,177 queries, one per dataset frame, so this is where
# it is felt. NOT part of either cache hash: changing it will not invalidate an
# existing buffer even though the base actions differ slightly, so keep it fixed
# for a given buffer.
policy_image_encoding: raw
# 95 matches the infer app's default (INFER_JPEG_QUALITY) and encode_image's.
policy_jpeg_quality: 95

# Fetch a whole action chunk per request instead of one action per request.
#   0   one POST /predict per query (unchanged behaviour)
#   -1  POST /predict_chunk, chunk length = the server's own --n-action-steps
#   N   POST /predict_chunk asking for N steps (server caps at chunk_size)
# Changes the network pattern, not the actions: /predict already serves from
# ACTPolicy.select_action()'s internal queue and ignores the observation for
# k-1 of every k calls, so a client-side queue returns the identical sequence.
# The queue is dropped on every policy.reset() - episode boundaries offline and
# online, and the intervention release edge.
policy_chunk_steps: 0

use_reward_manipulation_wrapper: false
terminate_on_success: false
dense_success_bonus_scale: null
base_policy:
  wandb_id: ''
  wt_type: best
  wt_version: latest
  local_path: null
reward_model:
  enabled: false
  backend: sarm
  server_url: http://127.0.0.1:8001
  request_timeout_s: 20.0
  require_server: true
  task_prompt: pick up the can and place it in the bin
  query_every_k: 5
  client_history_len: 40
  image_key: observation.images.agentview
  image_vflip: false
  num_stages: 4
  potentials:
  - 0.0
  - 0.05
  - 0.1
  - 0.15
  pbrs_gamma: null
  keep_sparse_term: true
  reward_mode: pbrs
  milestone_payouts:
  - 0.0
  - 0.1
  - 0.1
  - 0.1
  milestone_success_bonus: 0.7
  hysteresis_k: 5
  conf_threshold: 0.8
  monotonic: true
  offline_key: null
# checkpoint every N steps.
save_freq: 2500
# MUST stay true. With false the trainer rmtree's the run directory
# on success - deleting the checkpoints AND online_buffer_final.
no_cleanup: true
save_training_rollouts: false
training_rollout_prob: 0.2
resume_ckpt: null
# NOTE: `role` and `dist.*` are deliberately NOT here. They exist only in the
# distributed schema (ResidualTD3TrossenRealDistConfig), and the plain schema
# would reject them. They live in conf/execution/*.yaml instead.
